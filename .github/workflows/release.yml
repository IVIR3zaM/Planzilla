name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - "release/**"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "release/**"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

      - name: Check tag matches planzilla.__version__
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(uv run python -c 'import planzilla; print(planzilla.__version__)')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match __version__ v${version}" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  brew:
    runs-on: macos-latest
    needs: build
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Render formula from the local sdist
        run: |
          sdist="$(ls dist/planzilla-*.tar.gz)"
          sha="$(shasum -a 256 "${sdist}" | cut -d' ' -f1)"
          python3 release/render_formula.py "file://${PWD}/${sdist}" "${sha}" > planzilla.rb
          cat planzilla.rb

      - name: Install, test and audit the formula in a throwaway tap
        run: |
          brew tap-new planzilla-ci/local
          tap="$(brew --repository planzilla-ci/local)"
          mkdir -p "${tap}/Formula"
          cp planzilla.rb "${tap}/Formula/planzilla.rb"
          brew install --build-from-source planzilla-ci/local/planzilla
          brew test planzilla-ci/local/planzilla
          brew audit --strict planzilla-ci/local/planzilla

  publish:
    runs-on: ubuntu-latest
    needs: brew
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Require HOMEBREW_TAP_TOKEN
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN secret is empty; cannot push the formula to IVIR3zaM/homebrew-tap" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.whl \
            --title "${GITHUB_REF_NAME}" --generate-notes

      - name: Check the uploaded sdist matches the built one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sdist="planzilla-${version}.tar.gz"
          gh release download "${GITHUB_REF_NAME}" --pattern "${sdist}" --dir uploaded
          built="$(sha256sum "dist/${sdist}" | cut -d' ' -f1)"
          uploaded="$(sha256sum "uploaded/${sdist}" | cut -d' ' -f1)"
          if [ "${built}" != "${uploaded}" ]; then
            echo "Uploaded sdist sha256 ${uploaded} differs from built ${built}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "SHA256=${uploaded}" >> "$GITHUB_ENV"

      - name: Render Homebrew formula
        run: |
          url="https://github.com/IVIR3zaM/Planzilla/releases/download/${GITHUB_REF_NAME}/planzilla-${VERSION}.tar.gz"
          mkdir -p out
          python3 release/render_formula.py "${url}" "${SHA256}" > out/planzilla.rb

      - name: Push formula to the tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/IVIR3zaM/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp out/planzilla.rb tap/Formula/planzilla.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/planzilla.rb
          git commit -m "planzilla ${VERSION}" || { echo "Formula unchanged"; exit 0; }
          git push origin HEAD
