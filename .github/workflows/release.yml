name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Check tag matches planzilla.__version__
        run: |
          version="$(uv run python -c 'import planzilla; print(planzilla.__version__)')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match __version__ v${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Build sdist and wheel
        run: uv build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.whl \
            --title "${GITHUB_REF_NAME}" --generate-notes

      - name: Render Homebrew formula
        run: |
          sdist="dist/planzilla-${VERSION}.tar.gz"
          sha="$(sha256sum "${sdist}" | cut -d' ' -f1)"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/planzilla-${VERSION}.tar.gz"
          mkdir -p out
          python3 release/render_formula.py "${VERSION}" "${url}" "${sha}" > out/planzilla.rb

      - name: Push formula to the tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/IVIR3zaM/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp out/planzilla.rb tap/Formula/planzilla.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/planzilla.rb
          git commit -m "planzilla ${VERSION}" || { echo "Formula unchanged"; exit 0; }
          git push origin HEAD
