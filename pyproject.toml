[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "planzilla"
dynamic = ["version"]
description = "Plan, run and verify work with AI agents from Markdown plan files."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Reza Maghoul" }]
dependencies = []

[project.scripts]
planzilla = "planzilla.cli:main"
plz = "planzilla.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.version]
path = "src/planzilla/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/planzilla"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
